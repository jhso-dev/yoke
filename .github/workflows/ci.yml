name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # AFTER the build, on purpose: this is the check that executes the shipped client bundle, and
      # it skips when there is no build. Running it in `npm test` (before build) would skip forever —
      # which is exactly how v2.5 shipped a UI whose script never parsed.
      - run: npm run test:bundle

  # storage-opensearch against a REAL OpenSearch, so the adapter is never only skipped: the test
  # file skips itself when YOKE_TEST_OPENSEARCH_URL is unset, which keeps `npm test` green on a laptop
  # with no docker — and would keep it green here too. What is under test is the ENGINE's behaviour
  # (BM25 ranking, prefix terms against an analyzer's output, k-NN order, near-real-time visibility), so
  # a fake would encode the adapter's own beliefs about all four and prove none of them.
  opensearch-adapter:
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        # The cluster-health endpoint, not a port probe: OpenSearch accepts connections before the
        # cluster is ready to answer, so a TCP check passes and the first query fails.
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/adapters/storage-opensearch
        env:
          YOKE_TEST_OPENSEARCH_URL: http://localhost:9200
      # Non-vacuity: the suite above must not have been skipped. Without this the job is green either
      # way — the same failure mode the windows job taught us, where a silent skip reads as a pass.
      - name: the opensearch suite actually ran
        run: |
          npx vitest run src/adapters/storage-opensearch --reporter=json --outputFile=/tmp/os.json
          node -e "const r=require('/tmp/os.json');if(!r.numPassedTests)throw new Error('opensearch suite ran 0 tests — it skipped');console.log(r.numPassedTests+' opensearch tests ran')"
        env:
          YOKE_TEST_OPENSEARCH_URL: http://localhost:9200

  # storage-postgres against a REAL Postgres, twice: the pgvector image for the full suite, and a
  # plain postgres for the no-pgvector path (similar/putEmbedding must be genuinely absent, not
  # broken). The suite gates itself on the env vars and touches only yoketest_* schemas.
  postgres-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-novec:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/adapters/storage-postgres
        env:
          YOKE_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres
          YOKE_TEST_POSTGRES_NOVEC_URL: postgres://postgres:test@localhost:5433/postgres
      # Non-vacuity: the suite must not have been skipped — a silent skip reads as a pass.
      - name: the postgres suite actually ran
        run: |
          npx vitest run src/adapters/storage-postgres --reporter=json --outputFile=/tmp/pg.json
          node -e "const r=require('/tmp/pg.json');if(!r.numPassedTests)throw new Error('postgres suite ran 0 tests — it skipped');console.log(r.numPassedTests+' postgres tests ran')"
        env:
          YOKE_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres
          YOKE_TEST_POSTGRES_NOVEC_URL: postgres://postgres:test@localhost:5433/postgres

  # Windows native-binary check: better-sqlite3 / sqlite-vec prebuilds must
  # install and pass the main suite (the most common cross-platform trap).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # build:cli only. This job exists to validate the better-sqlite3/sqlite-vec prebuilds on
      # win32, not to run webpack a second time; the matrix job above covers the full build.
      - run: npm run build:cli
